# XcodeGen spec for users with Xcode: `brew install xcodegen && xcodegen && open Oyee.xcodeproj`.
# The generated Oyee.xcodeproj is gitignored. Set DEVELOPMENT_TEAM (or pick your team in Xcode → Signing).
name: Oyee

options:
  bundleIdPrefix: app.oyee
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""            # ← your team ID (a free personal team works; apps then expire after 7 days)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

packages:
  OyeeKit:
    path: .                         # the local Swift package (Package.swift in this directory)

targets:
  Oyee-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOS
      - path: Resources/Fonts
        type: folder
    dependencies:
      - package: OyeeKit
        product: OyeeKit
    settings:
      base:
        PRODUCT_NAME: Oyee
        PRODUCT_BUNDLE_IDENTIFIER: app.oyee.ios
        INFOPLIST_FILE: Resources/OyeeiOS-Info.plist   # URL scheme `oyee`, BGTaskSchedulerPermittedIdentifiers, UIBackgroundModes=fetch, ATS localhost
        TARGETED_DEVICE_FAMILY: "1,2"
        # OyeeKit itself is Swift 6 (strict concurrency). The iOS app target can't be compiled without the iOS SDK
        # here, so it uses Swift 5 mode to keep any SDK-specific concurrency diagnostics as warnings.
        SWIFT_VERSION: "5.0"
    scheme: {}

  Oyee-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/OyeeMac
      - path: Resources/Fonts
        type: folder
    dependencies:
      - package: OyeeKit
        product: OyeeKit
    settings:
      base:
        PRODUCT_NAME: Oyee
        PRODUCT_BUNDLE_IDENTIFIER: app.oyee.mac
        INFOPLIST_FILE: Resources/OyeeMac-Info.plist   # LSUIElement, URL scheme `oyee`, ATS localhost
        SWIFT_VERSION: "6.0"
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    scheme: {}
