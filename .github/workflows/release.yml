# Publishes Oyee's Android APK and macOS app on GitHub Releases.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release keystore (PKCS12)
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
# Every APK must be signed with the same key, or Android refuses to install it as an update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        run: |
          name="${GITHUB_REF_NAME#v}"
          if ! [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag must look like v1.2.3 (got $GITHUB_REF_NAME)" >&2; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OYEE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OYEE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OYEE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2; exit 1; fi
          export OYEE_KEYSTORE_FILE="$RUNNER_TEMP/oyee-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$OYEE_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease \
            -PoyeeVersionName=${{ needs.version.outputs.name }} \
            -PoyeeVersionCode=${{ needs.version.outputs.code }}
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/Oyee-${{ needs.version.outputs.name }}.apk"
          rm -f "$OYEE_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/apple
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # CFBundleVersion = commit count
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Tests
        run: swift test
      - name: Universal Oyee.app
        run: |
          UNIVERSAL=1 OYEE_VERSION=${{ needs.version.outputs.name }} scripts/build-macos-app.sh
          lipo -archs build/Oyee.app/Contents/MacOS/Oyee
          mkdir -p "$GITHUB_WORKSPACE/dist"
          ditto -c -k --keepParent build/Oyee.app "$GITHUB_WORKSPACE/dist/Oyee-${{ needs.version.outputs.name }}-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          v=${{ needs.version.outputs.name }}
          cat > notes.md <<EOF
          ## Install

          **Web:** <https://oyee.app>, nothing to install. Turn on browser notifications under *Devices*.

          **Android** (8.0+): download \`Oyee-$v.apk\` on your phone and open it, allowing *Install unknown apps* when asked.
          Updates install over the previous release. If you installed a self-built debug APK before, uninstall it once first
          (different signing key).

          **macOS** (14+, Apple Silicon and Intel): download \`Oyee-$v-macOS.zip\`, unzip, move \`Oyee.app\` to
          *Applications*. The app isn't notarized, so the first time **right-click → Open** (or run
          \`xattr -dr com.apple.quarantine /Applications/Oyee.app\`). It lives in the menu bar.

          **iOS:** build from source ([docs/setup.md](https://github.com/${{ github.repository }}/blob/main/docs/setup.md)).

          Then pair the device: on the web, *Devices → Pair a device*, and enter the code in the app.

          Verify downloads with \`SHA256SUMS.txt\`.
          EOF
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "${{ github.repository }}" \
            --title "Oyee ${{ needs.version.outputs.name }}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
